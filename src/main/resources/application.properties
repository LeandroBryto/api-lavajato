# Server Configuration
server.port=8080
server.servlet.context-path=/

# Spring Application Configuration
spring.application.name=web-scraper-api

# Jackson Configuration
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# Logging Configuration
logging.level.com.screenshot=INFO
logging.level.com.microsoft.playwright=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/web-scraper-api.log

# Management Endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# Custom Application Configuration
app.screenshot.default-timeout=30000
app.screenshot.default-format=png
app.screenshot.output-directory=screenshots/
app.scraping.default-timeout=30000
app.scraping.max-wait-time=10000